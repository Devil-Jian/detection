[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liverdet"
version = "0.1.0"
description = "Patient-level liver lesion detection comparisons on NCCT, real and synthetic CECT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0",
  "nibabel>=5.1",
  "Pillow>=10",
  "scipy>=1.11",
  "PyYAML>=6",
  "torch>=2.1",
  "torchvision>=0.16",
  "pycocotools>=2.0.7",
  "scikit-image>=0.21",
  "tqdm>=4.65",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.2"]
augment = ["albumentations>=1.4,<3", "opencv-python-headless>=4.8"]
test = ["pytest>=8"]
all = ["ultralytics>=8.2", "albumentations>=1.4,<3", "opencv-python-headless>=4.8", "pytest>=8"]

[project.scripts]
liverdet = "liverdet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
